<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0a0f1d" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#accentGrad)" stroke-width="6" opacity="0.4" />

  <!-- Subtle grid pattern lines -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="2">
    <line x1="80" y1="180" x2="432" y2="180" />
    <line x1="80" y1="256" x2="432" y2="256" />
    <line x1="80" y1="332" x2="432" y2="332" />
    <line x1="180" y1="80" x2="180" y2="432" />
    <line x1="256" y1="80" x2="256" y2="432" />
    <line x1="332" y1="80" x2="332" y2="432" />
  </g>

  <!-- Central Graduation Cap + Science Symbol -->
  <g transform="translate(0, -10)">
    <!-- Cap Diamond Base -->
    <polygon points="256,120 420,195 256,270 92,195" fill="url(#accentGrad)" />
    <!-- Cap Under-Shadow -->
    <polygon points="256,270 400,204 400,214 256,280 112,214 112,204" fill="#1e3a8a" opacity="0.7" />
    
    <!-- Skullcap Base -->
    <path d="M160,230 L160,300 C160,345 352,345 352,300 L352,230 Z" fill="#1e293b" stroke="url(#accentGrad)" stroke-width="6" />
    
    <!-- Tassel String and Pendant -->
    <path d="M370,205 C375,240 385,280 395,305" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round" />
    <circle cx="397" cy="316" r="10" fill="url(#goldGrad)" />

    <!-- Mathematical Sigma / Integral / Science Icon Badge -->
    <g transform="translate(256, 385) scale(1.1)">
      <!-- Circle container -->
      <circle cx="0" cy="0" r="44" fill="#0f172a" stroke="url(#accentGrad)" stroke-width="4" />
      <!-- Stylized Math Sum / Sigma Symbol -->
      <path d="M -18,-18 L 18,-18 L -4,0 L 18,18 L -18,18" fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>

  <!-- Bottom Brand Text -->
  <text x="256" y="475" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700" letter-spacing="4">PRÉPA CONCOURS</text>
</svg>
