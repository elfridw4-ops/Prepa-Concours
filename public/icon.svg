<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: Royal Midnight & Deep Slate -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="40%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Outer Ring Gradient: Electric Cyan to Deep Sapphire -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Academic Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="30%" stop-color="#fbbf24" />
      <stop offset="70%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Cyan Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <radialGradient id="centerGlow" cx="50%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- App Rounded Shield / Icon Container -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)" />
  <circle cx="256" cy="240" r="210" fill="url(#centerGlow)" />
  <rect width="496" height="496" x="8" y="8" rx="112" fill="none" stroke="url(#ringGrad)" stroke-width="6" opacity="0.45" />

  <!-- Quantum / Atomic Orbits (Physics Track) -->
  <g transform="translate(256, 235)">
    <!-- Orbit 1 -->
    <ellipse cx="0" cy="0" rx="175" ry="68" transform="rotate(-30)" fill="none" stroke="url(#ringGrad)" stroke-width="4.5" stroke-dasharray="14 7" opacity="0.65" />
    <!-- Orbit 2 -->
    <ellipse cx="0" cy="0" rx="175" ry="68" transform="rotate(30)" fill="none" stroke="#93c5fd" stroke-width="3" opacity="0.45" />

    <!-- Electron Beacons -->
    <circle cx="-135" cy="-60" r="8" fill="#38bdf8" filter="url(#softGlow)" />
    <circle cx="140" cy="65" r="9" fill="#fbbf24" filter="url(#softGlow)" />
  </g>

  <!-- Open Textbook of Knowledge (Academic Foundation) -->
  <g transform="translate(256, 350)">
    <path 
      d="M -130,-20 C -70,-45 -25,-40 0,-25 C 25,-40 70,-45 130,-20 L 130,22 C 70,-3 25,2 0,17 C -25,2 -70,-3 -130,22 Z" 
      fill="#1e293b" 
      stroke="#60a5fa" 
      stroke-width="6" 
      stroke-linejoin="round" 
    />
    <line x1="0" y1="-25" x2="0" y2="17" stroke="#93c5fd" stroke-width="5" stroke-linecap="round" />
    
    <!-- Subtle page line engravings -->
    <path d="M -110,-6 C -70,-24 -35,-20 -15,-10" stroke="#475569" stroke-width="3" stroke-linecap="round" fill="none" />
    <path d="M 110,-6 C 70,-24 35,-20 15,-10" stroke="#475569" stroke-width="3" stroke-linecap="round" fill="none" />
  </g>

  <!-- Central Academic Graduation Mortarboard & Golden Crown -->
  <g transform="translate(256, 175)">
    <!-- Cap Diamond Apex -->
    <polygon points="0,-75 140,-15 0,45 -140,-15" fill="url(#goldGrad)" filter="url(#softGlow)" />
    <polygon points="0,-65 125,-15 0,35 -125,-15" fill="#fef08a" opacity="0.4" />
    
    <!-- Skullcap Base -->
    <path d="M -75,20 L -75,65 C -75,100 75,100 75,65 L 75,20 Z" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="7" />
    
    <!-- Golden Tassel & Pendant -->
    <path d="M 95,5 C 110,40 120,85 128,110" fill="none" stroke="url(#goldGrad)" stroke-width="6.5" stroke-linecap="round" />
    <circle cx="129" cy="118" r="12" fill="url(#goldGrad)" filter="url(#softGlow)" />

    <!-- Center Torch Flame / Knowledge Spark -->
    <g transform="translate(0, -15)">
      <!-- Math Sigma Core -->
      <path d="M -30,-22 L 25,-22 L -8,0 L 25,22 L -30,22" fill="none" stroke="#0f172a" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M -30,-22 L 25,-22 L -8,0 L 25,22 L -30,22" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>

  <!-- Bottom National/Curriculum Badge Text -->
  <g transform="translate(256, 465)">
    <text text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" letter-spacing="6">PRÉPA CONCOURS</text>
    <text y="-28" text-anchor="middle" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="3">RÉPUBLIQUE DU BÉNIN</text>
  </g>
</svg>
